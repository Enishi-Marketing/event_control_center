# Leave blank to use the included templates, or enter local override paths.
LIGHTROOM_TEMPLATE_DIR=
PREMIERE_TEMPLATE=
GOOGLE_SHEETS_CREDENTIALS_FILE=/path/to/service-account.json
GOOGLE_SHEETS_SPREADSHEET_ID=spreadsheet_id_here
GOOGLE_SHEETS_WORKSHEET_NAME=Events
DEFAULT_EVENT_YEAR=2026-27
DEFAULT_SCHOOL_YEAR=2026-2027
